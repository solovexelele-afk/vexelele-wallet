<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https://tonapi.io https://testnet.tonapi.io https://api.coingecko.com https://api.ston.fi; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141415">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Starlify">
<title>Starlify Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Starlify Wallet. Graphite neutrals, one TON-blue accent, off-white primary action.
     The balance card is the one rich object on screen; everything around it stays quiet. */
  :root{
    --bg:#141415; --deep:#0f0f10; --card:#19191b; --raised:#232325;
    --line:rgba(237,237,237,.08); --line2:rgba(237,237,237,.14);
    --text:#ededed; --text2:#a1a1a6; --muted:#85858b;
    --acc:#2f9ff0; --up:#4cc38a; --down:#e5484d; --warn:#d9a441;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
    --ease:cubic-bezier(.22,1,.36,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font:inherit;color:var(--text)}
  ::selection{background:var(--acc);color:#fff}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
  svg.i{display:block;flex:none}
  [hidden]{display:none!important}

  /* header */
  .top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
    padding:calc(12px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 12px max(24px,env(safe-area-inset-left,0px));
    background:rgba(20,20,21,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
  .mark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--acc-fill,#1677c9);color:#fff;font-weight:600;font-size:15px;line-height:1;letter-spacing:-.02em;flex:none}
  .asset-head{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 0}
  .asset-head .ico.big{margin-bottom:8px}
  .asset-head .amt{font-size:36px;line-height:1.1;font-weight:500;letter-spacing:-.02em;margin:4px 0}
  .asset-head .muted{font-size:14px}
  .actions.two{grid-template-columns:repeat(2,1fr);max-width:240px;margin:0 auto;width:100%}
  .act:disabled{opacity:.35;pointer-events:none}
  .logo .muted{font-weight:400}

  main{max-width:480px;margin:0 auto;padding:24px max(24px,env(safe-area-inset-right,0px)) calc(64px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
  .view{display:flex;flex-direction:column;gap:16px;animation:in .3s var(--ease)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  body.still .view{animation:none}
  h1{font-size:36px;line-height:1.1;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
  h1 span{color:var(--text2)}
  h2{font-size:22px;line-height:1.2;font-weight:500;letter-spacing:-.01em}
  .muted{color:var(--text2)}
  p.muted{font-size:14px}
  small.lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lbl button{color:var(--acc);font-size:13px}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 20px;font-size:15px;font-weight:500;
    border-radius:12px;background:var(--raised);border:1px solid var(--line);transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
  .btn:hover{border-color:var(--line2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
  .btn.primary:hover{background:#fff}
  .btn.danger{color:var(--down)}
  .btn:disabled{opacity:.4;pointer-events:none}
  .row{display:flex;gap:8px}
  .row > *{flex:1;min-width:0}
  .row .btn{padding:0 12px;font-size:14px;white-space:nowrap}
  .back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text2);align-self:flex-start;min-height:32px;transition:color .15s var(--ease)}
  .back:hover{color:var(--text)}

  /* fields */
  .field{display:flex;flex-direction:column}
  .field input,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;outline:0;width:100%;transition:border-color .15s var(--ease)}
  .field input:focus,.field textarea:focus{border-color:var(--acc)}
  .field textarea{font-family:var(--mono);font-size:14px;min-height:128px;resize:vertical}
  .field.big input{font-size:28px;font-weight:500;padding:12px 16px;letter-spacing:-.01em}
  .err{color:var(--down);font-size:14px;min-height:20px}
  .note{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 16px;font-size:14px;color:var(--text2)}
  .note b{color:var(--text);font-weight:500}

  /* seed words */
  .words{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .words div{background:var(--card);padding:8px 12px;font-family:var(--mono);font-size:14px}
  .words div i{color:var(--muted);font-style:normal;margin-right:8px;font-size:12px}
  .words.blur div{filter:blur(6px);user-select:none}

  /* welcome */
  .welcome{min-height:calc(100svh - 160px)}
  .welcome-hero{display:flex;flex-direction:column;gap:12px;padding-top:8px}
  .preview{position:relative;border-radius:20px;padding:20px;border:1px solid var(--line);
    background:linear-gradient(160deg,#28282c 0%,#1c1c1f 55%,#161618 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);margin-bottom:8px}
  .preview-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);margin-bottom:24px}
  .preview-head span{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500}
  .preview-head svg{color:var(--acc)}
  .preview-row{display:flex;align-items:center;gap:12px;padding:8px 0}
  .preview-row + .preview-row{border-top:1px solid var(--line)}
  .preview-row b{font-weight:500;flex:1}
  .preview-row small{color:var(--muted);font-size:13px}
  .feats{list-style:none;display:flex;flex-direction:column}
  .feats li{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
  .feats li + li{border-top:1px solid var(--line)}
  .feats svg{color:var(--text2);margin-top:2px}
  .feats b{display:block;font-weight:500;font-size:15px}
  .feats small{display:block;color:var(--text2);font-size:13px}
  .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}

  /* balance card — the one rich object */
  .balance{position:relative;border-radius:20px;padding:20px;border:1px solid var(--line);
    background:linear-gradient(160deg,#28282c 0%,#1c1c1f 55%,#161618 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .bal-top{display:flex;justify-content:space-between;align-items:center}
  .bal-top .lbl{margin:0}
  .bal-brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
  .bal-brand svg{color:var(--acc)}
  .bal-tools{display:flex;gap:4px}
  .bal-tools button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:color .15s var(--ease),background-color .15s var(--ease)}
  .bal-tools button:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .spinning svg{animation:sp .8s linear}
  .balance .amt{margin-top:24px;font-size:40px;line-height:1;font-weight:500;letter-spacing:-.02em;word-break:break-all}
  .amt .frac,.amt .cur{color:var(--muted)}
  .amt .cur{font-size:.5em;margin-left:6px;letter-spacing:0}
  .balance .fiat{margin-top:8px;font-size:14px;color:var(--text2);display:flex;flex-wrap:wrap;gap:8px}
  .chg.plus{color:var(--up)} .chg.minus{color:var(--down)}
  .bal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:24px}
  .addr-chip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--text2);padding:4px 8px;margin-left:-8px;border-radius:8px;transition:background-color .15s var(--ease),color .15s var(--ease)}
  .addr-chip:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .bal-foot small{font-size:12px;color:var(--muted)}

  /* actions */
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;font-size:13px;color:var(--text2);transition:color .15s var(--ease)}
  .act b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:1px solid var(--line);color:var(--text);transition:background-color .15s var(--ease),transform .12s var(--ease)}
  .act:hover{color:var(--text)}
  .act:hover b{background:#2c2c2f}
  .act:active b{transform:scale(.96)}
  .act.primary b{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* tabs + lists */
  .tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .tabs button{flex:1;height:32px;border-radius:8px;font-size:14px;color:var(--text2);transition:background-color .15s var(--ease),color .15s var(--ease)}
  .tabs button.on{background:var(--raised);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .list{display:flex;flex-direction:column;margin-top:-8px}
  .item{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px;margin:0 -8px;border-radius:12px}
  .item.tap,.item.ev{cursor:pointer;transition:background-color .15s var(--ease)}
  .item.tap:hover,.item.ev:hover{background:var(--card)}
  .ico{width:40px;height:40px;border-radius:50%;background:var(--raised);color:var(--text2);display:grid;place-items:center;flex:none;overflow:hidden}
  .ico img,.ico > svg.logo-ton{width:100%;height:100%;object-fit:cover}
  .ico.in{color:var(--up)} .ico.out{color:var(--text2)}
  .ico.sm{width:28px;height:28px}
  .ico.big{width:56px;height:56px}
  .item .mid{flex:1;min-width:0}
  .item .mid b{display:flex;align-items:center;gap:4px;font-weight:500;font-size:15px}
  .item .mid small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .right{text-align:right;font-size:15px;white-space:nowrap}
  .item .right small{display:block;color:var(--muted);font-size:13px}
  .ok{color:var(--acc)}
  .market-note{font-size:13px;color:var(--muted);padding:8px 0 4px}
  .item .right .chg{font-size:13px}
  .list-head{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-top:8px;font-size:13px;color:var(--muted)}
  .list-head button{font-size:13px;color:var(--acc);padding:4px 0}
  .item.zero .right{color:var(--muted)}
  .plus{color:var(--up)} .minus{color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:32px 0;font-size:14px}

  .nfts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-top:8px}
  .nft{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--card);transition:border-color .15s var(--ease);min-width:0}
  .nft:hover{border-color:var(--line2)}
  .nft-img{aspect-ratio:1;max-width:100%;background:var(--raised);display:grid;place-items:center;color:var(--muted);overflow:hidden}
  .nft-img img{width:100%;height:100%;object-fit:cover}
  .nft b{font-size:13px;font-weight:500;padding:8px 12px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nft small{font-size:12px;color:var(--muted);padding:0 12px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* receive */
  .qr{background:#fff;padding:16px;width:min(264px,100%);margin:0 auto;border-radius:16px}
  .qr svg{display:block;width:100%;height:auto}
  .addr-box{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px 12px 12px 16px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
  .addr-box:hover{border-color:var(--line2)}
  .addr-box:active{background:var(--raised)}
  .addr-text{flex:1;min-width:0;font-family:var(--mono);font-size:13px;line-height:1.45;word-break:break-all;color:var(--text)}
  .addr-act{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;color:var(--acc)}
  .addr-act small{font-size:12px}
  .addr-box.done{border-color:var(--up)}
  .addr-box.done .addr-act{color:var(--up)}
  .addr-full{font-family:var(--mono);font-size:14px;word-break:break-all;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--card);text-align:center;color:var(--text2)}

  /* send */
  .assets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .asset{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 16px 8px 8px;flex:none;text-align:left;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
  .asset b{display:block;font-weight:500;font-size:14px}
  .asset small{display:block;font-size:12px;color:var(--muted)}
  .asset:hover{border-color:var(--line2)}
  .asset.on{border-color:var(--acc);background:var(--raised)}
  .recents{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:-8px}
  .recents .lbl{margin:0 4px 0 0}
  .chip-btn{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);transition:border-color .15s var(--ease),color .15s var(--ease)}
  .chip-btn:hover{border-color:var(--line2);color:var(--text)}
  .sum{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
  .sum div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;font-size:14px}
  .sum div + div{border-top:1px solid var(--line)}
  .sum div span:first-child{color:var(--muted);flex:none}
  .sum div span:last-child{text-align:right;word-break:break-all}
  .copyable{cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-family:var(--mono);font-size:13px}
  .copyable:hover{color:var(--acc)}
  .tx-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
  .tx-amt{font-size:32px;font-weight:500;letter-spacing:-.02em}
  .tx-amt.plus{color:var(--up)}
  .tx-head .muted{font-family:var(--mono);font-size:13px}

  .status{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:48px;text-align:center}
  .status .big{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--text)}
  .status .big.ok-state{color:var(--up)}
  .status .big.fail{color:var(--down)}
  .status .btn{max-width:320px}
  .spin{width:44px;height:44px;border:3px solid var(--raised);border-top-color:var(--text);border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* settings */
  .setting{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 4px;border-bottom:1px solid var(--line);text-align:left;color:var(--text);transition:color .15s var(--ease)}
  .setting svg{color:var(--muted)}
  .setting.danger{color:var(--down)}

  /* PIN */
  .pin-view{align-items:center;text-align:center}
  .pin-view .back{align-self:flex-start}
  .dots{display:flex;gap:16px;justify-content:center;margin:16px 0 4px}
  .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);transition:background-color .15s var(--ease),border-color .15s var(--ease)}
  .dots i.on{background:var(--text);border-color:var(--text)}
  .dots.shake{animation:shake .32s var(--ease)}
  @keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
  .pad{display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center;margin:8px 0}
  .pad button{width:72px;height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:500;display:grid;place-items:center;transition:background-color .12s var(--ease),transform .12s var(--ease)}
  .pad button:hover{background:var(--raised)}
  .pad button:active{transform:scale(.96);background:#2c2c2f}
  .pad button[data-k=del]{background:none;border-color:transparent;color:var(--text2)}
  .pin-view .btn{max-width:320px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;padding:12px 20px;border-radius:12px;transition:transform .25s var(--ease),opacity .25s var(--ease);z-index:50;pointer-events:none}
  .toast.show{transform:translate(-50%,0);opacity:1}


  /* ---------- оформление «Стандартное»: ярче, карточка в цвете TON ---------- */
  .setting-val{display:flex;align-items:center;gap:4px;color:var(--text2);font-size:14px}
  [data-theme="std"]{--bg:#131518;--card:#1a1d22;--raised:#252a31;--text2:#b4b9c2;--muted:#8c929c;--acc:#3ea6f2;--acc-fill:#1677c9}
  [data-theme="std"] .balance{border:0;background:linear-gradient(155deg,#2f9cec 0%,#1b7dd0 55%,#1468b5 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);color:#fff}
  [data-theme="std"] .balance .amt .frac,[data-theme="std"] .balance .amt .cur{color:rgba(255,255,255,.62)}
  [data-theme="std"] .bal-brand,[data-theme="std"] .bal-brand svg,[data-theme="std"] .balance .fiat{color:rgba(255,255,255,.82)}
  [data-theme="std"] .bal-tools button{color:rgba(255,255,255,.78)}
  [data-theme="std"] .bal-tools button:hover{color:#fff;background:rgba(255,255,255,.14)}
  [data-theme="std"] .addr-chip{color:rgba(255,255,255,.88);background:rgba(0,0,0,.14);margin-left:0}
  [data-theme="std"] .addr-chip:hover{background:rgba(0,0,0,.24);color:#fff}
  [data-theme="std"] .bal-foot small{color:rgba(255,255,255,.7)}
  [data-theme="std"] .act.primary b,[data-theme="std"] .btn.primary{background:var(--acc-fill);border-color:var(--acc-fill);color:#fff}
  [data-theme="std"] .btn.primary:hover{background:#1a86dc}
  [data-theme="std"] .act b{color:var(--acc)}
  [data-theme="std"] .act.primary b{color:#fff}
  [data-theme="std"] .tabs button.on{background:var(--acc-fill);color:#fff;box-shadow:none}
  [data-theme="std"] .dots i.on{background:var(--acc);border-color:var(--acc)}


  /* ---------- несколько кошельков ---------- */
  .wsw{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;padding:4px 8px;margin-left:-8px;border-radius:8px;color:inherit;transition:background-color .15s var(--ease)}
  .wsw:hover{background:rgba(255,255,255,.08)}
  .wallets{display:flex;flex-direction:column;gap:8px}
  .wrow{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .15s var(--ease)}
  .wrow.on{border-color:var(--acc)}
  .wpick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px;text-align:left}
  .wav{width:40px;height:40px;border-radius:12px;background:var(--raised);display:grid;place-items:center;font-weight:600;flex:none}
  .wrow.on .wav{background:var(--acc-fill,#1677c9);color:#fff}
  .wmid{flex:1;min-width:0}
  .wmid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wmid small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .wbal{font-size:14px;color:var(--text2);white-space:nowrap}
  .wedit{width:44px;align-self:stretch;display:grid;place-items:center;color:var(--muted);border-left:1px solid var(--line)}
  .wedit:hover{color:var(--text)}

  /* ---------- NFT ---------- */
  button.nft{text-align:left;color:inherit;padding:0}
  .list-head button{display:inline-flex;align-items:center;gap:4px}
  .nft-big{border-radius:16px;overflow:hidden;background:var(--raised);aspect-ratio:1;display:grid;place-items:center;color:var(--muted);max-width:100%}
  .nft-big img{width:100%;height:100%;object-fit:cover}
  .nft-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px}
  .nft-row b{display:block;font-weight:500}
  .nft-row small{display:block;color:var(--muted);font-size:13px}
  .nft-thumb{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--raised);display:grid;place-items:center;color:var(--muted);flex:none}
  .nft-thumb.lg{width:96px;height:96px;border-radius:16px}
  .nft-thumb img{width:100%;height:100%;object-fit:cover}

  /* ---------- обмен ---------- */
  .flip{align-self:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text2);margin:-8px 0;transition:background-color .15s var(--ease),transform .2s var(--ease)}
  .flip:hover{background:var(--raised);transform:rotate(180deg)}
  .quote{display:flex;flex-direction:column;gap:12px}
  .q-main{font-size:24px;font-weight:500;letter-spacing:-.01em}
  .q-main.muted{font-size:15px}
  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .seg button{flex:1;height:32px;border-radius:8px;font-size:14px;color:var(--text2)}
  .seg button.on{background:var(--raised);color:var(--text)}
  .minus-red{color:var(--down)}
  p.small{font-size:12px;text-align:center}
  .actions{grid-template-columns:repeat(4,1fr)}

  /* ---------- заставка ---------- */
  #splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg)}
  #splash svg{animation:pulse 1.2s var(--ease) infinite alternate}
  @keyframes pulse{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

  @media (max-width:560px){
    main{padding-top:20px}
    h1{font-size:32px}
    h2{font-size:20px}
    .balance .amt{font-size:36px}
    .field.big input{font-size:24px}
    .pad{grid-template-columns:repeat(3,64px);gap:12px}
    .pad button{width:64px;height:64px;font-size:22px}
    .nfts{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
