<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https://tonapi.io https://testnet.tonapi.io https://api.coingecko.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c0d0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="vexelele">
<title>vexelele wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0d0c;--panel:#131513;--panel2:#181b18;--line:#262a26;--text:#e9ece6;--muted:#8b928a;--acc:#c6f432;--up:#3ddc84;--down:#ff5a4e;--warn:#ffb340;
    --mono:'JetBrains Mono',ui-monospace,monospace;--display:'Unbounded',sans-serif;--sans:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font:inherit;color:var(--text)}
  ::selection{background:var(--acc);color:#000}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  .top{display:flex;justify-content:space-between;align-items:center;padding:18px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);font-family:var(--mono);font-size:14px}
  .top .logo i{color:var(--acc);font-style:normal}
  .net{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:6px 10px;color:var(--muted)}
  .net.test{border-color:var(--warn);color:var(--warn)}

  main{max-width:520px;margin:0 auto;padding:28px 16px 80px}
  .view{display:flex;flex-direction:column;gap:18px;animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:-.02em}
  h1 span{color:var(--acc)}
  h2{font-family:var(--display);font-weight:500;font-size:22px}
  p.muted,.muted{color:var(--muted)}
  small.lbl{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-bottom:6px}

  .btn{display:block;width:100%;text-align:center;font-family:var(--mono);font-size:15px;padding:16px;border:1px solid var(--line);transition:.15s}
  .btn:hover{border-color:var(--text)}
  .btn.primary{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{color:var(--down);border-color:#4a2522}
  .btn:disabled{opacity:.4;pointer-events:none}
  .row{display:flex;gap:10px}
  .row > *{flex:1}

  .field{display:flex;flex-direction:column;gap:6px}
  .field input,.field textarea{background:var(--panel);border:1px solid var(--line);padding:14px 16px;font-size:16px;outline:0;width:100%}
  .field input:focus,.field textarea:focus{border-color:var(--acc)}
  .field textarea{font-family:var(--mono);font-size:14px;min-height:130px;resize:vertical}
  .err{color:var(--down);font-size:14px;min-height:20px}
  .note{border:1px solid var(--line);border-left:3px solid var(--warn);padding:14px 16px;font-size:14px;color:var(--muted);background:var(--panel)}
  .note b{color:var(--text)}

  .words{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .words div{background:var(--panel);padding:10px 12px;font-family:var(--mono);font-size:14px}
  .words div i{color:var(--muted);font-style:normal;margin-right:6px;font-size:11px}
  .words.blur div{filter:blur(6px);user-select:none}

  /* home */
  .balance{border:1px solid var(--line);background:var(--panel);padding:26px 22px}
  .balance .amt{font-family:var(--display);font-size:clamp(34px,10vw,48px);font-weight:500;line-height:1.1;word-break:break-all}
  .balance .amt span{color:var(--muted);font-size:.55em;margin-left:6px}
  .balance .fiat{font-family:var(--mono);color:var(--muted);margin-top:6px}
  .addr-chip{margin-top:16px;display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:13px;border:1px solid var(--line);padding:7px 12px;color:var(--muted)}
  .addr-chip:hover{border-color:var(--acc);color:var(--text)}
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .act{border:1px solid var(--line);padding:16px 8px;text-align:center;font-family:var(--mono);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
  .act b{font-size:20px;font-weight:400;color:var(--acc);line-height:1}
  .act:hover{border-color:var(--acc);background:var(--panel)}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{font-family:var(--mono);font-size:13px;padding:12px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--text);border-color:var(--acc)}
  .list{display:flex;flex-direction:column}
  .item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .ico{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none;overflow:hidden;font-family:var(--mono);font-size:16px}
  .ico img{width:100%;height:100%;object-fit:cover}
  .ico.in{color:var(--up)} .ico.out{color:var(--down)}
  .item .mid{flex:1;min-width:0}
  .item .mid b{display:block;font-weight:500}
  .item .mid small{display:block;color:var(--muted);font-size:12px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .right{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
  .item .right small{display:block;color:var(--muted);font-size:11px}
  .plus{color:var(--up)} .minus{color:var(--down)}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}

  .bal-top{display:flex;justify-content:space-between;align-items:flex-start}
  .bal-tools{display:flex;gap:4px}
  .bal-tools button{width:34px;height:34px;border:1px solid var(--line);color:var(--muted);font-size:16px;display:grid;place-items:center}
  .bal-tools button:hover{color:var(--acc);border-color:var(--acc)}
  .spinning{animation:sp .8s linear infinite}
  .bal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .bal-foot .addr-chip{margin-top:0}
  .bal-foot small{font-family:var(--mono);font-size:11px}
  .pill{display:inline-block;font-size:11px;border:1px solid currentColor;padding:2px 8px;margin-left:6px;vertical-align:1px}
  .ok{color:var(--up);font-size:12px}
  .item.ev{cursor:pointer;transition:background .15s}
  .item.ev:hover{background:var(--panel)}
  .nfts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-top:14px}
  .nft{border:1px solid var(--line);display:flex;flex-direction:column;transition:.15s;min-width:0}
  .nft:hover{border-color:var(--acc)}
  .nft-img{aspect-ratio:1;max-width:100%;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:28px;overflow:hidden}
  .nft-img img{width:100%;height:100%;object-fit:cover}
  .nft b{font-size:13px;font-weight:500;padding:8px 10px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nft small{font-size:11px;color:var(--muted);padding:0 10px 10px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
  .ico.big{width:64px;height:64px;font-size:28px}
  .tx-amt{font-family:var(--display);font-size:30px;font-weight:500}
  .copyable{cursor:pointer}
  .copyable:hover{color:var(--acc)}
  .recents{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:-8px}
  .recents .lbl{margin:0 4px 0 0}
  .chip-btn{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:6px 10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip-btn:hover{border-color:var(--acc);color:var(--acc)}
  .pin-view{align-items:center;text-align:center}
  .pin-view .back{align-self:flex-start}
  .dots{display:flex;gap:18px;justify-content:center;margin:18px 0 4px}
  .dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);transition:background .15s,border-color .15s,transform .15s}
  .dots i.on{background:var(--acc);border-color:var(--acc);transform:scale(1.1)}
  .dots.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin:6px 0 10px}
  .pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);font-family:var(--display);font-size:26px;font-weight:500;transition:background .12s,border-color .12s}
  .pad button:hover{border-color:var(--acc)}
  .pad button:active{background:var(--acc);color:#000}
  .pad button[data-k=del]{border-color:transparent;font-size:22px;color:var(--muted)}
  .pin-view .btn{max-width:320px}
  .item.tap{cursor:pointer;transition:background .15s}
  .item.tap:hover{background:var(--panel)}
  .assets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .asset{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px 14px 10px 10px;flex:none;text-align:left;transition:.15s}
  .asset b{display:block;font-weight:600;font-size:14px}
  .asset small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .asset:hover{border-color:var(--text)}
  .asset.on{border-color:var(--acc);background:var(--panel)}
  .ico.sm{width:28px;height:28px;font-size:13px}
  .qr{background:#fff;padding:16px;width:min(280px,100%);margin:0 auto}
  .qr svg{display:block;width:100%;height:auto}
  .addr-full{font-family:var(--mono);font-size:14px;word-break:break-all;border:1px solid var(--line);padding:14px;background:var(--panel);text-align:center}
  .back{font-family:var(--mono);font-size:13px;color:var(--muted);align-self:flex-start}
  .back:hover{color:var(--acc)}
  .sum{border:1px solid var(--line);background:var(--panel)}
  .sum div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .sum div:last-child{border:0}
  .sum div span:first-child{color:var(--muted)}
  .sum div span:last-child{font-family:var(--mono);text-align:right;word-break:break-all}
  .status{text-align:center;padding:20px 0}
  .status .big{font-size:54px;line-height:1;color:var(--acc)}
  .spin{width:46px;height:46px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--acc);color:#000;font-family:var(--mono);font-weight:600;font-size:14px;padding:12px 20px;transition:transform .3s;z-index:50}
  .toast.show{transform:translate(-50%,0)}
  .setting{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
  .switch{width:46px;height:26px;border:1px solid var(--line);border-radius:13px;position:relative;background:var(--panel)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
  .switch.on{border-color:var(--warn)} .switch.on::after{left:23px;background:var(--warn)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a href="./" class="logo"><i>~/</i>vexelele <span class="muted">wallet</span></a>
  <span class="net" id="net-badge">mainnet</span>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.js" integrity="sha384-KZ9iM9JqTC8JCLaVPv/PkC5yCO2FJ4qykQ6jhXY565xW86rtPEZgqcLfEWMtqQmT" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tonweb-mnemonic@1.0.1/dist/web/index.js" integrity="sha384-QzafGEyv0Qc2I1s68zD3aHcfSG4Mz3UJRYrCrR+x9pUFugYvio3MFW/YW4loELe7" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" integrity="sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz" crossorigin="anonymous"></script>
<script src="wallet.js"></script>
<script src="fx.js"></script>
</body>
</html>
